# RL self-play eval: races two `multi_agent_racing` checkpoints against each other via
# `scripts/multi_sim.py`. Same track as `multi_level0.toml` / the `rl_multi_level2.toml` training
# config, but both controllers step at 50 Hz to match the frequency the self-play policy was
# trained at (`rl_multi_level2.toml`'s single `env.freq`).

[[controller]]
file = "rl_multi_agent_racing_controller.py" # drone 0: most recent multi_agent_racing checkpoint
[[controller]]
file = "rl_multi_agent_racing_controller.py" # drone 1: 2nd most recent multi_agent_racing checkpoint

[deploy]
### Settings only relevant for deployment
check_race_track = true
check_drone_start_pos = true
real_track_objects = true

[[deploy.drones]]
id = 10
channel = 100
drone_model = "cf21B_500"

[[deploy.drones]]
id = 20
channel = 100
drone_model = "cf21B_500"


[sim]
physics = "first_principles"
drone_model = "cf21B_500"
freq = 500                      # Simulation frequency, in Hz
attitude_freq = 500             # Controller frequency, in Hz.
render = true                   # Enable/disable Crazyflow's GUI
camera = -1
[[sim.cam_config]]
distance = 5.0
azimuth = 180.0
elevation = -25.0
lookat = [0.0, 0.0, 0.0]


[env]
id = "MultiDroneRacing-v0"
seed = -1
[[env.kwargs]]
freq = 50               # Matches training's env.freq (rl_multi_level2.toml)
sensor_range = 0.7
control_mode = "attitude"
[[env.kwargs]]
freq = 50
sensor_range = 0.7
control_mode = "attitude"

[env.track]
randomize = false

[[env.track.gates]]
pos = [0.5 , 0.25, 0.7]
rpy = [0.0, 0.0, -0.78]
[[env.track.gates]]
pos = [1.05, 0.75, 1.2]
rpy = [0.0, 0.0, 2.35]
[[env.track.gates]]
pos = [-1.0, -0.25, 0.7]
rpy = [0.0, 0.0, 3.14]
[[env.track.gates]]
pos = [0.0, -0.75, 1.2]
rpy = [0.0, 0.0, 0.0]

[[env.track.obstacles]]
pos = [0.0, 0.75, 1.55]
[[env.track.obstacles]]
pos = [1.0, 0.25, 1.55]
[[env.track.obstacles]]
pos = [-1.5, -0.25, 1.55]
[[env.track.obstacles]]
pos = [-0.5, -0.75, 1.55]

[[env.track.drones]]
pos = [-1.5, 0.55, 0.01]
rpy = [0, 0, 0]
vel = [0, 0, 0]
ang_vel = [0, 0, 0]
[[env.track.drones]]
pos = [-1.5, 0.95, 0.01]
rpy = [0, 0, 0]
vel = [0, 0, 0]
ang_vel = [0, 0, 0]

[env.track.safety_limits]
pos_limit_low = [-2.5, -1.5, -1e-3]
pos_limit_high = [2.5, 1.5, 2.0]
